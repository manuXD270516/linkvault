<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>LinkVault</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Tarjeta de respaldo (critic I5 de la iteración 3). Un bot que sí siga el `meta refresh` de `/p/:slug` acaba aquí,
      y sin estas etiquetas compondría una tarjeta vacía. Son fijas y las mismas para todas las rutas del SPA: no
      llevan ningún dato de ninguna oferta ni de ninguna persona, porque el `index.html` es el mismo para todo el mundo
      y aquí no hay nada que personalizar sin SSR. La imagen es la misma que usa la página pública de la api.
    -->
    <meta property="og:site_name" content="LinkVault" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LinkVault" />
    <meta
      property="og:description"
      content="Guarda aquí las ofertas que te pasan por WhatsApp y no las pierdas."
    />
    <meta property="og:image" content="/assets/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <lv-root></lv-root>
  </body>
</html>
