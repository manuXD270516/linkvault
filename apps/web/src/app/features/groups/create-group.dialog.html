<h2 mat-dialog-title i18n="@@groups.create.title">Crear un grupo</h2>

<mat-dialog-content>
  <form class="flex flex-col gap-2" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <mat-form-field>
      <mat-label i18n="@@groups.create.name">Nombre del grupo</mat-label>
      <input matInput formControlName="name" autocomplete="off" />
      @if (form.controls.name.invalid) {
        <mat-error i18n="@@groups.create.nameInvalid">
          Escribe un nombre de hasta 60 caracteres
        </mat-error>
      }
    </mat-form-field>

    @if (failure(); as currentFailure) {
      @if (tooManyGroups()) {
        <p class="text-(--mat-sys-error)" role="alert" i18n="@@groups.error.tooManyGroups">
          Ya perteneces a 20 grupos, el máximo
        </p>
      } @else {
        <lv-request-error [failure]="currentFailure" />
      }
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button type="button" mat-dialog-close i18n="@@groups.cancel">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="submitting()"
    (click)="submit()"
    i18n="@@groups.create.submit"
  >
    Crear grupo
  </button>
</mat-dialog-actions>
