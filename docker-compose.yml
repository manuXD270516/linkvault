# Infraestructura local de LinkVault (ADR-017, D6 de bootstrap-monorepo; ADR-034 correo; search ADR-006 F2).
# Solo infraestructura: api, worker y web se ejecutan en el host con `pnpm nx serve`.
#
#   docker compose up -d --wait                         # mongo, redis, object-store, mailpit (sin buckets)
#   docker compose --profile ai-local up -d --wait      # + ollama
#   docker compose --profile search up -d --wait        # + meilisearch
#   docker compose --profile demo up -d --wait          # + meilisearch (mismo servicio; luego api:seed-demo)
#
# Puertos del host configurables (MONGO_PORT, REDIS_PORT, OBJECT_STORE_PORT,
# MAILPIT_SMTP_PORT, MAILPIT_UI_PORT, OLLAMA_PORT, MEILI_PORT) por si otro proyecto ya los ocupa;
# por defecto, los estándar.
# URI desde el host:        mongodb://localhost:27017/linkvault?directConnection=true
# URI desde un contenedor:  mongodb://mongo:27017/linkvault?replicaSet=rs0
# Mailpit UI (smoke local): http://localhost:8025  · SMTP: localhost:1025
# Meili (solo con profile search): http://localhost:7700  · en red compose: http://meilisearch:7700
name: linkvault

services:
  mongo:
    image: mongo:7.0.43
    hostname: mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    # El healthcheck inicializa el replica set de forma idempotente y solo da "healthy" con primario:
    # - rs.status() falla con NotYetInitialized (code 94) en un volumen vacío -> rs.initiate con mongo:27017.
    # - Cualquier otro error se relanza (el check falla y su log queda visible en `docker inspect`).
    # - Se usa isWritablePrimary (rs.status().ok vale 1 antes de la elección) y quit() con código
    #   explícito, porque `mongosh --eval` devuelve 0 aunque la expresión sea falsa.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (e) {
            if (e.codeName === 'NotYetInitialized' || e.code === 94) {
              rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            } else { throw e; }
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  redis:
    image: redis:7.4.11
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

  # Almacén de objetos S3 (change `object-store`, ADR-052; design D6, D14 y D16). Producto elegido por la matriz:
  # SeaweedFS 4.47 (`docs/object-store-matrix/matriz.md`, veredicto de la 5.3). El servicio está **copiado** del compose
  # que midió la matriz, `docs/object-store-matrix/seaweedfs.compose.yml`: misma imagen, misma orden, mismo entorno y
  # mismo volumen; la comparación de la tarea 7.1 lo comprueba («Configuración entregada» de la matriz). Lo único que
  # cambia es lo de su lista cerrada:
  # - valores de desarrollo por defecto para las credenciales (`S3_ACCESS_KEY`, `S3_SECRET_KEY`, la identidad de
  #   administración única de SeaweedFS) y para la clave del cifrado del bucket de CV (`OBJECT_STORE_SSE_KEY`, que
  #   SeaweedFS lee de `WEED_S3_SSE_KEK`: **64 caracteres [0-9a-f]**, 32 bytes). El valor por defecto de la clave es
  #   **solo de desarrollo** (el hexadecimal de «linkvault-dev-only-sse-kek-00000»): desarrollo cifra igual que
  #   producción (design D6), pero con una clave que no protege nada;
  # - el healthcheck de solo lectura de C8 (tarea 4.3) con los parámetros provisionales de C9 (4.4): no crea buckets;
  #   los crea `object-store provision` (design D4), que encadena `pnpm infra:up`;
  # - un solo puerto publicado, el S3. El filer (8888), el maestro (9333), el volumen (9340) y sus gRPC escuchan sin
  #   autenticación y no se publican;
  # - la red propia `object-store-net` (design D14), de la que es el único miembro: los demás servicios de este fichero
  #   no llegan a ningún puerto del almacén. Sin `internal: true`, porque una red interna no deja publicar el puerto S3
  #   en el host, y `api` y `worker` corren en el host.
  # - el guardia de arranque de la clave (design D16), en `entrypoint`, con `command` intacto: sin clave, `weed mini`
  #   genera una propia y la guarda en el volumen (`/data/.mini_sse_kek`, medido en la 3.4). El guardia sale con 64 si
  #   `WEED_S3_SSE_KEK` no son exactamente 64 caracteres [0-9a-f] (sin imprimirla) y con 65 si el volumen ya tiene
  #   `.mini_sse_kek` (arrancó alguna vez sin clave: ver docs/RUNBOOK.md antes de tocarlo); si no, `exec` del
  #   `Entrypoint` de la imagen (`/entrypoint.sh`) con los mismos argumentos: el proceso que queda es el de la matriz.
  #   Va en línea, sin fichero montado, y cada dólar se escribe doble para que Compose no lo interpole.
  # Sin `depends_on` (así `config --images object-store` da una sola línea, la que leen la 7.1 y 35b) y sin `restart`
  # (la comparación con el compose de la matriz no admite claves de más).
  object-store:
    image: ${OBJECT_STORE_IMAGE:-chrislusf/seaweedfs}:${OBJECT_STORE_IMAGE_TAG:-4.47}
    entrypoint:
      - /bin/sh
      - -c
      - |-
        case "$${WEED_S3_SSE_KEK-}" in
          *[!0-9a-f]*) kek_format=bad ;;
          *) kek_format=hex ;;
        esac
        if [ "$$kek_format" != hex ] || [ "$${#WEED_S3_SSE_KEK}" -ne 64 ]; then
          echo "object-store-guard: WEED_S3_SSE_KEK (OBJECT_STORE_SSE_KEY) must be exactly 64 characters [0-9a-f]; refusing to start (see docs/RUNBOOK.md)" >&2
          exit 64
        fi
        if [ -e /data/.mini_sse_kek ]; then
          echo "object-store-guard: /data/.mini_sse_kek exists: this volume was started without WEED_S3_SSE_KEK and may hold objects encrypted with a key SeaweedFS generated; refusing to start (see docs/RUNBOOK.md before touching the file)" >&2
          exit 65
        fi
        exec /entrypoint.sh "$$@"
      - object-store-guard
    command:
      - 'mini'
      - '-dir=/data'
      - '-webdav=false'
      - '-admin.ui=false'
      - '-s3.port.iceberg=0'
      - '-s3.port.lance=0'
      - '-master.telemetry=false'
    environment:
      # Credenciales y clave solo de desarrollo local; se sobrescriben desde .env.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-linkvault}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-linkvault-dev-secret}
      WEED_S3_SSE_KEK: ${OBJECT_STORE_SSE_KEY:-6c696e6b7661756c742d6465762d6f6e6c792d7373652d6b656b2d3030303030}
    ports:
      - '${OBJECT_STORE_PORT:-9000}:8333'
    volumes:
      - object-store-data:/data
    networks:
      - object-store-net
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', '--max-time', '3', 'http://127.0.0.1:8333/healthz']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 1s

  # Captura SMTP local para correo transaccional (ADR-034). Sin perfil: mismo arranque que mongo/redis/object-store.
  # CI y tests unitarios/integración usan CapturingMailer (`MAIL_PROVIDER=capture`); no dependen de este servicio.
  mailpit:
    image: axllent/mailpit:v1.27.7
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.0
    profiles: ['ai-local']
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # Búsqueda híbrida (change search / ADR-006 F2, ADR-036). No arranca sin profile `search`
  # ni sin profile `demo` (demo-seed / ADR-042 — mismo servicio, sin segundo sembrador).
  # En local el puerto se publica para `nx serve` en el host; en producción Meili MUST quedar en
  # red interna (VPC / compose internal) — no exponer el puerto ni la master key a Internet (RUNBOOK).
  meilisearch:
    image: getmeili/meilisearch:v1.14
    profiles: ['search', 'demo']
    environment:
      MEILI_ENV: development
      # Solo desarrollo; no uses este valor fuera de local. Producción: secreto propio, nunca en repo.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meili-master-key-change-me}
    ports:
      - '${MEILI_PORT:-7700}:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  object-store-data:
  ollama-data:
  meili-data:

# Red propia del almacén (design D14 de `object-store`): solo `object-store`. Sin `internal: true` (ver el servicio).
networks:
  object-store-net:
