# Infraestructura local de LinkVault (ADR-017, D6 de bootstrap-monorepo).
# Solo infraestructura: api, worker y web se ejecutan en el host con `pnpm nx serve`.
#
#   docker compose up -d --wait                         # mongo, redis, minio
#   docker compose --profile ai-local up -d --wait      # + ollama
#
# Puertos del host configurables (MONGO_PORT, REDIS_PORT, MINIO_PORT, MINIO_CONSOLE_PORT, OLLAMA_PORT)
# por si otro proyecto ya los ocupa; por defecto, los estándar.
# URI desde el host:        mongodb://localhost:27017/linkvault?directConnection=true
# URI desde un contenedor:  mongodb://mongo:27017/linkvault?replicaSet=rs0
name: linkvault

services:
  mongo:
    image: mongo:7.0.43
    hostname: mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    # El healthcheck inicializa el replica set de forma idempotente y solo da "healthy" con primario:
    # - rs.status() falla con NotYetInitialized (code 94) en un volumen vacío -> rs.initiate con mongo:27017.
    # - Cualquier otro error se relanza (el check falla y su log queda visible en `docker inspect`).
    # - Se usa isWritablePrimary (rs.status().ok vale 1 antes de la elección) y quit() con código
    #   explícito, porque `mongosh --eval` devuelve 0 aunque la expresión sea falsa.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (e) {
            if (e.codeName === 'NotYetInitialized' || e.code === 94) {
              rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            } else { throw e; }
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  redis:
    image: redis:7.4.11
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

  minio:
    # MinIO ya no publica en Docker Hub; quay.io es el registro oficial del mismo editor.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # Credenciales solo de desarrollo local; se sobrescriben desde .env.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-linkvault}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-linkvault-dev-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.0
    profiles: ['ai-local']
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  minio-data:
  ollama-data:
