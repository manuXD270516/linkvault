# Infraestructura local de LinkVault (ADR-017, D6 de bootstrap-monorepo; ADR-034 correo; search ADR-006 F2).
# Solo infraestructura: api, worker y web se ejecutan en el host con `pnpm nx serve`.
#
#   docker compose up -d --wait                         # mongo, redis, minio, mailpit
#   docker compose --profile ai-local up -d --wait      # + ollama
#   docker compose --profile search up -d --wait        # + meilisearch
#
# Puertos del host configurables (MONGO_PORT, REDIS_PORT, MINIO_PORT, MINIO_CONSOLE_PORT,
# MAILPIT_SMTP_PORT, MAILPIT_UI_PORT, OLLAMA_PORT, MEILI_PORT) por si otro proyecto ya los ocupa;
# por defecto, los estándar.
# URI desde el host:        mongodb://localhost:27017/linkvault?directConnection=true
# URI desde un contenedor:  mongodb://mongo:27017/linkvault?replicaSet=rs0
# Mailpit UI (smoke local): http://localhost:8025  · SMTP: localhost:1025
# Meili (solo con profile search): http://localhost:7700  · en red compose: http://meilisearch:7700
name: linkvault

services:
  mongo:
    image: mongo:7.0.43
    hostname: mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    # El healthcheck inicializa el replica set de forma idempotente y solo da "healthy" con primario:
    # - rs.status() falla con NotYetInitialized (code 94) en un volumen vacío -> rs.initiate con mongo:27017.
    # - Cualquier otro error se relanza (el check falla y su log queda visible en `docker inspect`).
    # - Se usa isWritablePrimary (rs.status().ok vale 1 antes de la elección) y quit() con código
    #   explícito, porque `mongosh --eval` devuelve 0 aunque la expresión sea falsa.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (e) {
            if (e.codeName === 'NotYetInitialized' || e.code === 94) {
              rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            } else { throw e; }
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  redis:
    image: redis:7.4.11
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

  minio:
    # MinIO ya no publica en Docker Hub; quay.io es el registro oficial del mismo editor.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # Credenciales solo de desarrollo local; se sobrescriben desde .env.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-linkvault}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-linkvault-dev-secret}
      # Alias autenticado para el healthcheck: el `local` que trae la imagen es anónimo y no puede crear buckets.
      # `MC_HOST_<alias>` deja la credencial fuera de la línea de comandos.
      MC_HOST_admin: http://${S3_ACCESS_KEY:-linkvault}:${S3_SECRET_KEY:-linkvault-dev-secret}@localhost:9000
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    # El healthcheck crea **los dos buckets** de forma idempotente y solo da "healthy" con los dos puestos, igual que
    # el de mongo con el replica set:
    # - snapshots (D12 de link-enrichment, ADR-022): la comprobación normal es un `ilm rule ls`, que solo lee; falla
    #   tanto si el bucket no existe como si no tiene configuración de ciclo de vida, y solo entonces se crea el
    #   bucket y se importa la regla.
    # - `mb --ignore-existing` no falla con el bucket ya creado e `ilm rule import` **reemplaza** la configuración
    #   entera, así que repetirlo deja una sola regla; `ilm rule add` acumularía una por arranque.
    # - la expiración a 30 días no es decorativa: el bucket guarda páginas completas y su razón de ser es poder
    #   construir después el golden real sin volver a pedirle nada al sitio, que no necesita historia infinita.
    # - cv (D6 de cv-upload-extract, ADR-028 §1): **sin** regla de expiración —un CV no caduca solo, y borrarlo por
    #   un temporizador sería destruir datos de una persona— y **sin** política anónima, que es la que abriría los
    #   bytes del dato más personal del producto a cualquiera con la URL. `mb` crea el bucket privado por defecto,
    #   así que no hay nada que poner: lo que hace falta es no ponerlo. El nombre por defecto es `cvs` y no `cv`
    #   porque S3 (y MinIO con él) exige entre 3 y 63 caracteres.
    # - las dos comprobaciones son **conjunciones independientes**, no una sola cadena: con un volumen que ya tenía
    #   el bucket de snapshots, la primera pasa y, si colgara de ella, el de CV no llegaría a crearse nunca. Quien ya
    #   tenía el proyecto levantado no vería el bucket nuevo y lo descubriría con un `500` al subir su CV.
    # - se hace aquí y no en un contenedor de un solo uso porque `docker compose up -d --wait` da por fallido un
    #   servicio que termina, aunque termine bien, y entonces `--wait` no garantizaría que los buckets ya existen.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc ready local &&
          { mc ilm rule ls admin/${S3_SNAPSHOTS_BUCKET:-snapshots} > /dev/null 2>&1 ||
          { mc mb --ignore-existing admin/${S3_SNAPSHOTS_BUCKET:-snapshots} &&
          echo '{"Rules":[{"ID":"expire-snapshots-30d","Status":"Enabled","Expiration":{"Days":30},"Filter":{}}]}'
          | mc ilm rule import admin/${S3_SNAPSHOTS_BUCKET:-snapshots}; }; } &&
          { mc ls admin/${S3_BUCKET:-cvs} > /dev/null 2>&1 ||
          mc mb --ignore-existing admin/${S3_BUCKET:-cvs}; }
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  # Captura SMTP local para correo transaccional (ADR-034). Sin perfil: mismo arranque que mongo/redis/minio.
  # CI y tests unitarios/integración usan CapturingMailer (`MAIL_PROVIDER=capture`); no dependen de este servicio.
  mailpit:
    image: axllent/mailpit:v1.27.7
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.0
    profiles: ['ai-local']
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # Búsqueda híbrida (change search / ADR-006 F2, ADR-036). No arranca sin profile `search`.
  # En local el puerto se publica para `nx serve` en el host; en producción Meili MUST quedar en
  # red interna (VPC / compose internal) — no exponer el puerto ni la master key a Internet (RUNBOOK).
  meilisearch:
    image: getmeili/meilisearch:v1.14
    profiles: ['search']
    environment:
      MEILI_ENV: development
      # Solo desarrollo; no uses este valor fuera de local. Producción: secreto propio, nunca en repo.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meili-master-key-change-me}
    ports:
      - '${MEILI_PORT:-7700}:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  minio-data:
  ollama-data:
  meili-data:
