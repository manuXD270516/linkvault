# Fuente única para el orquestador (scripts/change.sh) y /lv:new.
# Cada change: nombre, ADRs implicados, agentes y párrafo de alcance que se pasa a /opsx:ff.
changes:
  - name: bootstrap-monorepo
    adrs: [001, 006, 007, 009, 011, 014]
    agents: [devops, backend-dev, frontend-dev, ai-engineer]
    scope: |
      Nx workspace con pnpm: apps/api (Nest + Fastify), apps/worker (Nest standalone), apps/web (Angular 22 standalone, zoneless),
      libs/shared, libs/ai (solo estructura de carpetas y ports). ESLint con no-restricted-imports para SDKs de IA fuera de
      libs/ai/infrastructure/providers y regla de capas (domain no importa @nestjs, mongoose, bullmq). Vitest en los 5 proyectos.
      docker-compose.yml: mongo 7 replica set rs0 (inicializado por su healthcheck, ver ADR-017), redis 7, minio, ollama bajo profile ai-local. .env.example.
      GitHub Actions: lint → openspec validate --all → nx affected test (AI_CHAIN=mock) → build. README con comandos.
      Solo /health en api y worker. NADA de features de negocio.
  - name: ai-gateway-core
    adrs: [005, 014, 016]
    agents: [ai-engineer]
    scope: |
      Implementar docs/design-v0.2.md §4.1–4.6, §4.9, §4.10 y la spec de §4.13 en libs/ai: ports, AiTask, runTask,
      StructuredOutputPipeline (un repair prompt, siguiente proveedor, degradación), RoutingPolicy por capabilities,
      MockDeterministicProvider (synth y replay primero, record después), OllamaProvider, OpenRouterProvider,
      AiUsageLedger en Mongo, circuit breaker, PiiRedactor, PromptRegistry (front-matter + Mustache), caché por inputHash.
      Sin proveedores de pago ni BYOK aún. Tarea de ejemplo: classify-skills.
  - name: ai-eval-harness
    adrs: [014]
    agents: [ai-engineer]
    scope: |
      docs/design-v0.2.md §4.11: libs/ai/evals/<task>/golden.jsonl, corredor `nx run ai:eval --task --provider`,
      métricas schema_validity_rate, field_accuracy, skills_recall/precision, latency_p50, cost_per_run; reporte Markdown en reports/.
      CI corre con mock/replay. Incluir 5 vacantes anonimizadas de ejemplo (placeholder para reemplazar por reales).
      Modo `record` del MockDeterministicProvider (diferido desde ai-gateway-core, ADR-018): delega en un upstream real, guarda solo
      respuestas que validan, y si el upstream es `external` redacta con PiiRedactor antes de enviar y guarda el texto reinyectado.
      Punto de entrada real para grabar fuera del preset de Vitest (target `ai:record-fixtures`) y /lv:fixtures actualizado para usarlo.
  - name: auth-users
    adrs: [012]
    agents: [backend-dev, frontend-dev]
    scope: |
      Registro/login email+password (Argon2id), access token en memoria, refresh en cookie httpOnly SameSite=Lax con rotación
      y detección de reuso, /auth/refresh, /auth/logout, perfil con aiConsent.externalProviders, outputLanguage, redactName.
      Frontend: páginas login/registro, interceptor, guard, store de sesión.
  - name: groups
    adrs: [002]
    agents: [backend-dev, frontend-dev]
    scope: |
      CRUD de grupo, código de invitación, unirse por código, roles owner/member, salir del grupo. Frontend: lista y detalle de grupo.
      `/` pasa a ser la lista de grupos del usuario, con estado vacío, y sustituye al saludo "Hola, {displayName}" de
      auth-users (D11). Rutas visibles en español como las de auth-users (`/grupos`).
  - name: job-links
    adrs: [002, 008, 009]
    agents: [backend-dev, frontend-dev]
    scope: |
      JobLink canónico con dedupe platform:externalJobId → urlHash; canonicalizadores para LinkedIn, Computrabajo, Indeed,
      Trabajopolis, Get on Board; GroupLink; POST /links y POST /links/import (texto plano con varias URLs, ej. chat de WhatsApp);
      respuesta con alreadyInGroups (B6); outbox_events + relay a BullMQ. Frontend: guardar link, importar texto, lista por grupo y privada.
      Resuelto lo heredado de `groups` (Open Questions de su design.md): DELETE /api/groups/:id borra los `group_links` del grupo
      dentro de su misma transacción, mediante `GroupDeletionHooks` (ADR-021 §6); el `JobLink` canónico nunca se borra.
      Lo demás que traía de `groups` se movió: el límite de intentos de POST /api/groups/join, a `applications-tracking`, y
      `settings.defaultVisibility`, a `group-comments`.
  - name: link-enrichment
    adrs: [003, 010, 014]
    agents: [backend-dev, ai-engineer, frontend-dev]
    scope: |
      Worker: job enrich-link idempotente, ExtractorStrategy chain (OG/JSON-LD → adapter por plataforma → runTask extract-job →
      headless tras flag), merge por procedencia por campo, cola por dominio con limiter y robots.txt, snapshot en MinIO,
      previewStatus pending|enriched|partial|failed|manual, SSE link.enriched. Frontend: card con preview, edición manual con origen por campo.
      extract-job se declara `dataSensitivity: public` y cada ejecución pasa un plazo total por link en `ctx.signal`, para que una
      importación masiva (B1) no espere los timeouts completos de toda la cadena (ADR-018).
      Antes de activar la IA en el preview: golden set de extract-job con 20+ vacantes reales anonimizadas (bolsas de Bolivia y
      LatAm, ES/EN) en libs/ai/src/evals/extract-job/ generado con `/lv:golden 20` tras registrar extract-job como tarea evaluable,
      con field_accuracy (title/company/modality), skills_recall/precision y línea base en replay (ADR-019).
      Registro de entradas pendientes de fixture en tests (diferido desde ai-eval-harness): el mock en replay anota tarea, idioma,
      input y directorio de fixtures de cada FixtureMissing en un archivo con ruta absoluta (solo NODE_ENV=test, deduplicado al
      consumir, tests que esperan FixtureMissing a propósito excluidos) y `ai:record-fixtures --from-pending` lo graba; /lv:fixtures
      pasa a usarlo.
      Heredado de `job-links` (ADR-021): la cola `enrich-link` ya existe y `api` publica en ella LinkCreated.v1 desde su outbox, pero
      NADIE la consume; este change escribe ese consumidor y tiene que ser idempotente POR SÍ MISMO, no solo por el `jobId`
      determinista `enrich:<linkId>:<previewVersion>`: la retención de la cola (removeOnComplete al día o a los 1000, removeOnFail a
      la semana) olvida los jobs y, a partir de ahí, un evento republicado vuelve a entrar. Descargar SIEMPRE por `displayUrl`, nunca
      por `normalizedUrl`, que es solo identidad (fuerza https, quita www., fragmento y parámetros de campaña, y puede no resolver).
      Backfill de los links que quedaran en `previewStatus: pending` sin job (relay apagado, evento agotado a las 24 h o guardados
      antes de este change): decidir si hace falta y, si lo hace, reencolar por `linkId` reusando el mismo `jobId`.
      Formas de URL que hoy caen en `generic` y se deduplican por `urlHash`: las subpáginas (/apply) y los prefijos de idioma de Get
      on Board. Ninguna de las cinco plataformas previstas quedó sin canonicalizador; si aparecen enlaces reales que justifiquen esas
      formas, se amplía el canonicalizador en este change.
      Rate limit de POST /api/links/import, diferido en `job-links` porque hasta aquí la importación no encolaba trabajo real: en
      cuanto cada importación dispare hasta 50 descargas y ejecuciones de IA, contar las llamadas por usuario con el mismo mecanismo
      de `auth` (ventanas fijas en Redis, 429 too_many_attempts con Retry-After).
  - name: paste-job-description
    adrs: [003, 010, 018, 022]
    agents: [backend-dev, ai-engineer, frontend-dev]
    scope: |
      Decisión humana del 2026-09-18, tras el smoke de `link-enrichment`: se adelanta a `applications-tracking` porque
      de las cinco bolsas del manifiesto hoy solo una se deja leer. LinkedIn e Indeed lo prohíben por robots.txt,
      Computrabajo bloquea, y Trabajopolis bloquea en su CDN el cliente HTTP de Node aunque deje pasar a curl con las
      mismas cabeceras (reports/smoke/link-enrichment/REPORT.md §6). No se sortea: es una protección deliberada.
      Pegar la descripción de una oferta es el único camino lícito para esas bolsas, y seguir postulaciones sobre
      tarjetas sin título sería peor producto que no seguirlas.
      Alcance: en una tarjeta que no se pudo leer (y en cualquier otra, como corrección), pegar el texto de la oferta;
      `extract-job` lo lee con la misma salida `{ isJobPosting, preview }` y sus campos entran en el preview con un
      origen propio (ni "leído de la página" ni "escrito por <nombre>": "pegado por <nombre>"), sujeto al mismo merge de
      ADR-022 que no pisa lo manual y a la misma escritura condicionada por `previewVersion`. El texto pegado es de un
      tercero y NO se persiste ni se registra, igual que el chat en `job-links`; sí pasa por la higiene de emails y
      teléfonos antes de la IA. La tarea sigue siendo `public`. Límite por usuario con el limitador de
      `apps/api/src/infrastructure/limits/`, y la ejecución se atribuye a quien pega.
      Heredado de `link-enrichment` y decidible aquí: un link cuyo `displayUrl` (inmutable, ADR-021) lleva un parámetro
      que el robots.txt del sitio prohíbe queda ilegible para siempre aunque su historial `originalUrls` tenga la misma
      vacante sin ese parámetro. Decidir si, cuando robots niega el `displayUrl`, se prueban las demás URLs del
      historial antes de rendirse con `robots_disallowed`.
      Golden: añadir a `extract-job` casos de texto pegado (sin HTML, con ruido de chat alrededor) sin tocar los siete
      de páginas, con su línea base en replay y fixtures grabados contra Ollama local.
  - name: groups-ownership-join-limit
    adrs: [020, 021, 025]
    agents: [backend-dev, frontend-dev]
    scope: |
      Decisión humana del 2026-09-19 tras el debate de applications-tracking: la transferencia de propiedad de un grupo y el
      límite de intentos de POST /api/groups/join salen de `applications-tracking` a este change, que se entrega ANTES. Ambas
      son deudas de `groups` (Risks de su design.md) que `job-links` volvió más caras; no dependen de las postulaciones, que
      sobreviven al borrado del grupo (lo decide el ADR de `applications-tracking`).
      Transferencia: el owner nombra propietario a otro miembro y pasa a member en una escritura atómica; la membresía owner es
      única, garantizada por un índice único parcial con nombre explícito (`one_owner_per_group`) y detección de duplicados por
      `keyPattern` completo. Borrar, salir y expulsar condicionan su escritura al rol (`deleteGroup` borra primero la membresía owner
      de quien pide; `removeMember` devuelve removed | now_owner | not_member), para que ninguna carrera deje un grupo sin
      propietario ni borre uno que ya cambió de manos. Después el antiguo owner puede salir.
      Límite del join: códigos incorrectos contados por usuario (10) y por IP (100, IPv6 por /64) en ventanas fijas de 15 min con
      el contador de `apps/api/src/infrastructure/limits/`, primero el del usuario (si ya bloquea, 429 sin tocar la IP), consumidos antes de
      resolver y devueltos con try/finally salvo en
      InvalidInviteCode, solo en los contadores que contaron; un acierto no reinicia; 429 too_many_attempts con Retry-After por
      el error de dominio TooManyJoinAttempts con su rama en el filtro; falla abierto. `ipLimitGroup` pasa de `auth` a
      infraestructura de plataforma.
      Frontend: "Nombrar propietario", textos del propietario para salir, confirmación de borrado que sugiere transferir y
      mensaje del 429. En ES siempre "propietario"; en EN "owner". Decisiones no triviales en ADR-025.
  - name: applications-tracking
    adrs: [004, 015]
    agents: [backend-dev, frontend-dev]
    scope: |
      Application (userId, linkId) único, máquina de estados canónica con stageLabel en IN_PROCESS, ApplicationEvent,
      visibility private por defecto con opt-in group, fitScore? reservado, evento ApplicationStale modelado (sin notificación).
      Frontend: kanban por estado, timeline, avatares en card de grupo.
      La transferencia de propiedad de un grupo y el límite de intentos de POST /api/groups/join, que este change heredaba de
      `groups`, van ahora en el change anterior, `groups-ownership-join-limit` (decisión humana del 2026-09-19).
  - name: group-comments
    adrs: [015, 026]
    agents: [backend-dev, frontend-dev]
    scope: |
      GroupLinkComment plano (texto ≤ 500, autor, fecha), crear y borrar propio. Card muestra últimos 2 y contador.
      Heredado de `job-links`: los campos `comment`, `tags` y `pinned` de `group_links` que describe docs/design.md, que su schema
      dejó fuera porque nada los usaba (hoy la relación es `{ groupId, linkId, sharedBy, sharedAt }`); este change los añade con lo
      que necesite la card, sin tocar los índices `(groupId, linkId)` único y `(groupId, sharedAt, _id)` del listado paginado.
      Decisión humana del 2026-09-19: de esos campos solo entra `comment` (la nota de quien comparte); `tags` y `pinned` quedan
      fuera hasta que un uso los pida, y `settings.defaultVisibility` pasa a `public-preview-share`.
  - name: public-preview-share
    adrs: [013, 027]
    agents: [backend-dev, frontend-dev]
    scope: |
      GET /p/:slug en la API: HTML con OG tags desde el preview y redirect a la SPA para humanos; enlace público por link
      (`group_links.publicShare`, slug opaco de 12 caracteres que se quema al despublicar).
      Frontend: vista pública del preview en /oferta/:slug y CTA "Guardar en LinkVault" con ?import=<slug>.
      Heredado de `groups` (D1 de su design.md): el `slug` de grupo de docs/design.md. **Resuelto sin crearlo** (ADR-027 §1):
      la única URL pública que nace aquí identifica un link compartido, no un grupo, y la decisión humana del 2026-09-19 pide
      que sea opaca —un slug derivado del nombre del grupo diría a qué grupo pertenece, que es justo lo que la página no debe
      filtrar—. Ni campo `slug` en `groups`, ni índice, ni backfill: la herencia queda cerrada y ningún change posterior la
      arrastra.
      Decisión humana del 2026-09-19 (group-comments): `settings.defaultVisibility` del grupo sale de `group-comments` y entra
      aquí, donde significa "los links de este grupo se comparten públicamente por defecto: sí/no" (docs/design-v0.2.md §5.5,
      `sharePublic` true por defecto en los links de grupo). **Resuelto** (ADR-027 §7): `public` por defecto —y un grupo sin el
      campo se lee `public`—, lo cambia el owner con PATCH /api/groups/:id/settings, aplica **solo** a las relaciones nuevas
      (guardar e importar) y no escribe en ningún link ya compartido, que conserva su propio interruptor.
      Heredado de `group-comments` (ADR-026): la página pública `/p/:slug` NO expone comentarios ni notas de grupo. Cumplido:
      el contrato público es un `strictObject` con solo los campos de la vacante y el mapeo va por lista explícita.
      Lo que este change NO hace y deja a `deploy-prod`: fijar PUBLIC_PAGE_BASE_URL y WEB_BASE_URL por entorno, configurar el
      proxy y sus límites por cliente, y despublicar los enlaces de quien borre su cuenta (ver el scope de `deploy-prod`).
  - name: cv-upload-extract
    adrs: [006, 009, 028]
    agents: [backend-dev, frontend-dev]
    scope: |
      POST /api/cv multipart (PDF/DOCX ≤ 5 MiB) al bucket de CV de MinIO (`S3_BUCKET`, por defecto `cvs`: S3 exige
      nombres de 3 a 63 caracteres), clave `<userId>/<cvId>` sin nombre ni extensión; `cv_documents` con versiones,
      isDefault y el texto extraído, más `cv_version_counters` (un entero por persona) para que un número de versión no
      se reutilice tras un borrado. Worker: colas propias `extract-cv` (pdf-parse fijado a ^1.1.1, mammoth) y
      `delete-cv-file`, las dos por outbox (ADR-009) y el relay enrutando por tipo de evento.
      Decisión humana del 2026-09-20: **no hay ninguna ruta que devuelva los bytes** —ni servida por la API ni
      prefirmada— y **sí hay vista previa del texto**, `GET /api/cv/:id/text-preview` con `{ status, text, chars,
      complete }` y los primeros 2.000 caracteres, que es la única señal honesta de que un PDF a dos columnas se leyó
      entrelazado. Hasta 5 CV (la sexta subida, `409 too_many_cvs`), un solo marcado por índice único parcial con
      promoción al borrarlo, y tres contadores por persona que fallan abiertos (10 subidas, 60 vistas previas, 30
      rechazos). Frontend: `/mi-cv` para subir, listar, marcar por defecto, ver lo que leímos y eliminar, con la línea
      de privacidad honesta. Decisiones no triviales en ADR-028.
      Lo que este change NO hace y deja a `deploy-prod`: el cifrado en reposo y la política de retención del bucket
      (desviación explícita de docs/design.md §8), el borrado de cuenta con sus objetos, la recogida de objetos
      huérfanos, el aviso de privacidad sobre el CV y el límite por IP y el tope de cuerpo en el proxy (ver el scope de
      `deploy-prod`). El control de consentimiento que completa la frase de privacidad de `/mi-cv` es de
      `cv-match-suggestions`.
  - name: cv-match-suggestions
    adrs: [014, 018, 020, 029, 030]
    agents: [ai-engineer, backend-dev, frontend-dev]
    scope: |
      **Partido en dos por decisión humana (2026-09-20): este change entrega el análisis y toda la privacidad; el bucle de
      juez y la revisión humana de las sugerencias van en `cv-suggestions-review`.** Motivo: el scope original acumulaba
      trabajo diferido de otros tres changes y habría sido el PR más grande del proyecto, con la superficie de privacidad
      y la de calidad del modelo abiertas a la vez. Se registra en ADR-029.

      Proveedores decididos por el autor: **Ollama local y OpenRouter limitado a modelos `:free` con
      `data_collection: "deny"`** (ADR-018 §12), detrás del consentimiento explícito y con el CV pasado por el
      `PiiRedactor`. **BYOK queda fuera**: sigue en su propio change `ai-byok`.

      docs/design-v0.2.md §4.7 y §4.12: tarea match-cv, MatchReport con evidence obligatoria, RuleBasedMatcher degradado,
      ai_analyses, Application.fitScore **derivado al leer** (nadie lo escribe; ADR-030 §5), y el paso alcanzado que se
      guarda con el análisis y se **devuelve al consultarlo** (sondeo; ADR-030 §9). **El aviso en vivo por SSE
      `analysis.step` se difiere a `cv-suggestions-review`**.
      Frontend: badge de fit y el informe en pantalla.
      PiiRedactor: detectores de dirección postal y documento de identidad (CI con extensión departamental, DNI, cédula), afinados
      con CVs reales anonimizados (diferidos desde ai-gateway-core, ADR-018). Métricas de redacción en el eval harness
      (skills ocultadas por la redacción y PII anotada que no se redacta) sobre ese golden de CVs, para medir la sobre-redacción
      y el falso negativo aceptados en ADR-018 (diferidas desde ai-eval-harness, ADR-019).
      Controles de IA en el perfil del SPA (diferidos desde auth-users, ADR-020; la API y los valores por defecto ya existen en
      PATCH /api/users/me): consentimiento de proveedores externos con texto honesto (qué dato se envía, a quién, qué se
      redacta y que es revocable), guardando `consentedAt` y la versión del texto aceptado; idioma de salida con la etiqueta
      "Idioma de los análisis de IA" (`outputLanguage`); y redacción del nombre propio (`redactName`).
      Heredado de `cv-upload-extract` (ADR-028): el control de consentimiento va en **Perfil** (`/perfil`, no existe
      ninguna pantalla "Ajustes") y **sustituye la promesa antigua de `/mi-cv`** —"Tu CV solo lo ves tú y hoy no lo lee
      ninguna IA. No saldrá de LinkVault sin tu autorización."—, que este change **desmiente** al ser el primero en que
      un CV puede salir de nuestra infraestructura. La línea nueva nombra dónde se autoriza, qué se envía y qué se
      redacta, con un identificador de traducción nuevo (ADR-030 §12). Si quiere avisar en vivo del final de la
      extracción, el evento `cv.extracted` va por el canal SSE que ya existe (eso no es el progreso del análisis de
      encaje).
  - name: cv-suggestions-review
    adrs: [014, 018, 019, 029]
    agents: [ai-engineer, backend-dev, frontend-dev]
    scope: |
      Segunda mitad de `cv-match-suggestions` (ADR-029): sube la calidad de las sugerencias sin volver a tocar la
      privacidad, que aquel change ya cerró.
      docs/design-v0.2.md §4.8: tarea `critique-suggestions` y evaluator-optimizer acotado (máx 2 iteraciones, para si
      el score del juez ≥ 0.8, si Δ < 0.05 o si se agota el budget; juez distinto del generador si hay ≥2 proveedores,
      que con Ollama y OpenRouter ya se cumple), guardando `judgeScore` y `judgeModel` con el informe.
      `ai_feedback` ("no me convence") y su export a `candidates.jsonl` para revisión humana antes de entrar al golden
      (design §4.11). Frontend: diff aceptar/rechazar de cada sugerencia sobre el CV.
      **Aquí entra el aviso en vivo por SSE `analysis.step`**, diferido desde `cv-match-suggestions` (ADR-030 §9): allí
      había tres mecanismos para contar una espera de cuarenta segundos, y el bucle de juez —con más pasos y más
      espera— es donde un canal se justifica. Incluye publicar el paso, repartirlo solo a su dueño y que el mensaje no
      lleve nada del CV ni del informe.
      Métricas del eval harness para el bucle: correlación del `score` con etiquetas humanas (1–5) y coste por vuelta,
      para que una iteración de más se vea en el reporte y no solo en la factura.
  - name: study-roadmap
    adrs: [014]
    agents: [ai-engineer, frontend-dev]
    scope: |
      resources.seed.json curado por skill, tarea build-roadmap que prioriza missingSkills y completa con LLM marcando verified=false,
      roadmaps colección, export a Markdown. Frontend: roadmap por semanas.
  - name: ai-byok
    adrs: [014]
    agents: [ai-engineer, backend-dev, frontend-dev]
    scope: |
      Vault libsodium secretbox con AI_VAULT_KEY, claves por vendor (anthropic, openai, openrouter), proveedores byok:<userId>:<vendor>
      con prioridad 0 en routing, AnthropicProvider y OpenAIProvider, revocación, redactor pino. Frontend: gestión de claves en perfil.
  - name: deploy-prod
    adrs: [001, 009, 020, 033]
    agents: [devops]
    scope: |
      Decisiones D1–D14 (ADR-033). Camino canónico: docker-compose.prod.yml + Traefik + Let's Encrypt, imágenes multi-stage
      en GHCR, réplicas del worker, healthchecks, OUTBOX_RELAY en exactamente una api. CD: staging en main y prod en tag v*
      (verify → build/push GHCR → ssh/compose pull+up; smoke /health; dry-run NO es aceptación). Staging y prod = dos
      targets compose (hosts placeholder). Observabilidad mínima: GET /metrics (Prometheus) + pino; **sin OTel** en este
      change. Traefik: rutas /p/ y /api/ → api, else → web; /metrics y /health* no públicos (red interna/ACL); rate limit
      por IP y clientMaxBodySize ≤ 5 MiB + multipart en POST /api/cv; Referrer-Policy en SPA (esp. /unirse); access logs
      sin query en /login, /registro, /unirse. TRUST_PROXY=true solo en compose.prod detrás de Traefik.
      infra/README: operar compose+Traefik; una línea “otros hosts no soportados en este change”.
      Borrado de cuenta DELETE /api/users/me (password; 401 si incorrecto): cascada atómica con user, sessions, memberships
      (409 sole owner con miembros; borrar grupo si owner solo vía GroupDeletionHooks + sesión Mongo), applications+events,
      group_link_comments (borrar + commentCount/commentsRevision como RUNBOOK), $unset note donde sharedBy, $unset
      publicShare de lo publicado, user_links deleteMany, cv_documents+contadores+objetos userId/, ai_analyses, ai_usage
      DELETE, user_ai_keys, roadmaps, ai_feedback; consumers BullMQ ack si user gone. Aviso /privacidad + UI peligro.
      Object store: MinIO; CV SSE-S3 sin lifecycle de borrado; snapshots 30d; GC huérfanos documentado.
      Env prod: PUBLIC_PAGE_BASE_URL, WEB_BASE_URL, ENRICH_*, PASTE_*, AI_*, OPENROUTER_*, AI_VAULT_KEY, AI_PROMPTS_DIR.
      Herencias cerradas aquí: ADR-020 (trustProxy, reseteo password operador, privacidad, borrado); groups (logs sin
