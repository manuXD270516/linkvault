  - name: deploy-image-verification
    adrs: [048, 049, 033, 032]
    agents: [devops, backend-dev, frontend-dev, ai-engineer]
    scope: |
      Fila 34. **Deuda descubierta en la revisión del 2026-09-23: `cd-staging` acumula 21 ejecuciones y 21
      fallos, desde la primera, que es el propio commit de `deploy-prod` (#35). El despliegue nunca ha
      funcionado y las filas 17–33 se fusionaron encima.**

      Dos causas, y la segunda explica por qué la primera sobrevivió 21 corridas:
      1. `docker/api.Dockerfile:23` y `worker.Dockerfile:22` hacen `pnpm install --prod --frozen-lockfile`
         dentro de `dist/apps/<app>`. **Reproducido localmente**: Nx genera ahí package.json, lockfile y
         workspace propios, así que no falta ningún lockfile. Lo que ocurre es que Nx **copia el campo
         `packageManager: pnpm@12.4.2`** al manifiesto generado y **no** escribe la entrada
         `packageManagerDependencies` que ese campo exige en pnpm 12; pnpm quiere añadirla, `--frozen-lockfile`
         se lo prohíbe y aborta con `ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE`. Retirando ese campo del
         manifiesto generado, el mismo install con el candado intacto termina en 3,4 s. Nunca pudo funcionar,
         y la reproducibilidad no es lo que estorba.
      2. El job de despliegue exige `STAGING_HOST`/`STAGING_SSH_USER`/`STAGING_SSH_KEY`/`STAGING_COMPOSE_DIR`
         y falla a propósito si faltan (ADR-033 D10: "a dry-run is NOT an accepted CD outcome"). El repo no
         tiene **ningún** secret configurado, así que el pipeline es **rojo por construcción**: el rojo era
         el estado esperado, nadie lo miraba, y un defecto real de build se escondió detrás.

      Entrega: build de imagen reproducible (sin renunciar a la resolución bloqueada); **verificación del
      artefacto en el propio CI, sin servidor** —las imágenes se levantan con compose en el runner y se
      comprueba que la api arranca y responde `/health` con mongo y redis—; y un estado de CD honesto, que
      distinga "no hay dónde desplegar" de "el despliegue falló", sin afirmar nunca que se desplegó algo que
      no se desplegó. El DoD exige `cd-staging` **en verde**, no "el CI pasa".

      El debate añadió un **segundo defecto nunca verificado**: `docker-compose.prod.yml` no declara variables que
      `api` y `worker` validan al arrancar (correo y TTL de auth en api; `WEB_BASE_URL` y correo en worker), y los dos
      terminan antes de escuchar. Arreglar la imagen no habría servido de nada. Por eso la verificación levanta **la
      pila entera con ese mismo compose**, no un compose escrito para CI: es donde el defecto estaba escondido.
      `cd-prod` **entra en el alcance** (hereda artefacto y los tres resultados; nunca se ha ejecutado).

      Al cerrar el debate, la **decisión humana A1** revocó "ningún cambio funcional de la aplicación": el change
      toca también `libs/shared`, `libs/ai`, `apps/api` y `apps/web` para cerrar la contradicción de elegibilidad
      BYOK (ADR-049) hasta la pantalla. Lo que se mantiene es que no se toca nada **por iniciativa propia**: todo lo
      que entra es consecuencia de una contradicción que este change destapa y que no se fusiona a sabiendas.

      Lo que **no** cierra, enumerado con dónde se retoma, en `proposal.md` §"Lo que este change NO cierra": sigue sin
      haber servidor de staging, el healthcheck de MinIO sigue aprovisionando buckets, el paso de secretos por ssh sin
      endurecer, el workflow reutilizable de `verify`, el rojo falso del modo de prueba con destino configurado, la
      comprobación post-merge del tag `:staging`, que el adaptador SMTP no sabe autenticarse, y sustituir MinIO
      manteniendo mientras tanto su espejo en `ghcr.io` (ADR-048 §8). Todo eso entra en la fila 35. El aviso de
      consentimiento apagado del perfil estuvo en esa lista y **salió de ella**: se partió por
      vendor dentro de este change el 2026-09-25 (`profile-byok-consent-off-<vendor>`, id de i18n
      `profile.byok.vendorKeyInactive`).

      Fuera: provisionar servidor de staging y sus secretos —eso es la fila 35—, Traefik/DNS y publicar en registries
      de extensiones.
  - name: object-store
    adrs: [051, 052, 048, 006, 022, 028, 033]
    agents: [devops, backend-dev]
    scope: |
      Fila 35a, primera pieza de la fila 35 (ADR-051 §1: la fila se ejecuta como 35a → 35b → 35c y la precedencia
      de ADR-048 §Consecuencias aplica a la fila entera; ningún change de otra fila entra entre medias). `main`
      sigue en "verificado sin destino" al terminar; lo que se entrega es la precondición del host `arm64`.
      Es la letra **(f)** del `scope` original de la fila 35 (ver la nota de trazabilidad de `staging-host`).
      Decisiones en **ADR-052** (debate de tres iteraciones, 2026-09-26).
      **Sustituir MinIO.** MinIO community está archivado desde febrero de 2026, sin parches ni imágenes, y nuestro
      espejo (`ghcr.io/manuxd270516/linkvault-minio`, ADR-048 §8) es solo `amd64`. Antes de nada se ejecuta el
      corredor `ubuntu-24.04-arm` en este repositorio privado; si no está, se para y pregunta.
      **Matriz ejecutada, por fases y con parada** sobre SeaweedFS, RustFS y Garage (MinIO solo como control del
      arnés): el día 1, imágenes `amd64`/`arm64` sin credenciales y forja mantenida; después, el cribado en el orden
      de la lista, que se detiene cuando el puntero ya no puede cambiar
      (sin CLI del producto, sin acceso anónimo, cifrado que **protege**:
      disco sin el CV y con un control, otra clave que no lo lee o con la que no arranca, clave fuera del disco); los
      tests reales de la app, el healthcheck de solo lectura y el tiempo hasta sano solo en el candidato que señala el
      puntero; y un veredicto. La regla de parada prima el cifrado nativo de los CV (confirmada por el usuario el
      2026-09-26); un punto de revisión a los 7 días solo para el change si nadie da cifrado nativo; sin nadie apto,
      se para y vuelve al usuario. Evidencia en `docs/object-store-matrix/`;
      el servicio entregado se compara entero con el medido (solo difiere una lista cerrada) y C5 se repite sobre él
      antes de escribir la elección.
      **Salidas escritas en la spec:** SSE-C vía un middleware de la fábrica del cliente S3, con la clave junto a
      `AI_VAULT_KEY`, **solo si** el cifrado del almacén no se ha podido demostrar con las pruebas de la matriz.
      **Retención de snapshots siempre por barrido** diario en el `worker` (decisión del usuario, 2026-09-26), que se
      niega si los dos buckets coinciden; la expiración del almacén no se mide ni se configura.
      **Aprovisionamiento** por la API S3 con `object-store provision`/`verify` en la imagen de `api`, después del
      `up`; `verify` estricto (sin reglas de ciclo de vida ni snapshots de más de 31 días, rechazo anónimo solo por
      falta de autenticación). Healthcheck del almacén de solo lectura. Una fábrica de cliente S3 por proceso, con plazos y política de checksums, y suites
      de contrato.
      **Deltas:** ADDED `platform/object-store`; MODIFIED de «Infraestructura con un comando»
      (`platform/local-environment`), «Compose de producción» y ADDED «Las imágenes de la pila se pueden descargar en
      la arquitectura del destino» (`platform/production-deploy`), «CD a staging en main» (`platform/ci-pipeline`),
      «Bucket de CV cifrado en reposo», «Retención de snapshots» y «Recogida de objetos huérfanos documentada»
      (`cv/documents`), el seed (`platform/demo-seed`) y «Liveness» (`platform/runtime-health`: `api` y `worker`
      escuchan en todas las interfaces, decisión del usuario del 2026-09-28).
      **Paso a `arm64`:** `build-verify-publish` de `cd-staging` en `ubuntu-24.04-arm`, con la identidad por digest y
      su falsación repetidas en `arm64`. `infra/deploy/check-image-platforms.sh` compara las plataformas del registro
      con las del destino; una arquitectura ausente es `artifact`, no `environment`. Minutos de CI medidos.
      **Plazo de arranque** recalculado con tiempos medidos, en la línea `WAIT_TIMEOUT` de
      `infra/ci/verify-artifact.sh`, que 35b lee.
      **Operación sin `mc` diferida:** arrancar, desplegar y verificar no usan `mc`; listar, borrar y recoger huérfanos
      pasan a un change posterior (se propondrá al archivar este) y sus secciones del RUNBOOK quedan marcadas como
      pendientes.
      **Traslados ejecutados** en `staging-host` y en el `scope` de `verify-reusable-workflow`, en el mismo PR, con base
      en `main` (que ya contiene la #65).
      **Orden de archivo:** 35a y 35c modifican los dos «CD a staging en main» (`platform/ci-pipeline`); el orden por
      archivo es **35a → 35c**, y 35c redacta su MODIFIED sobre el texto que deje 35a.
      Fuera: mantener el espejo de MinIO (se retira sin borrar el paquete), migrar objetos (no hay usuarios todavía),
      el host (35b) y `cd-prod` (35c).
  - name: e2e-suite
    adrs: [053, 048, 051, 018, 019, 020, 034, 042]
    agents: [frontend-dev, devops, ai-engineer]
    scope: |
      **En paralelo a 35a, como excepción a la precedencia de la fila 35** (ADR-048 §Consecuencias, extendida a la
      fila entera por ADR-051 §1), decidida por el usuario el 2026-09-26 y registrada en **ADR-053** con seis
      condiciones: no toca ficheros de despliegue ni requirements que modifiquen 35a, 35b o 35c (en particular, no
      «CD a staging en main»); corre solo a mano hasta medir sus minutos, y con el 70 % del mes consumido no se lanza
      en CI; el despliegue de 35b no espera a la suite, pero **invitar sí, a `e2e-remote` en verde contra staging**
      sobre el commit desplegado (sin respaldo local; sin PR-1 en `main`, desde la cabeza de su rama; el recorrido a mano en el móvil, último recurso); la medición
      de 35b excluye por `userId` a las cuentas E2E (Q1, trasladada a `staging-host` en un PR solo de spec antes de
      su `/opsx:apply`); mismo método que la fila; y **35a va primero**: la suite solo ocupa sus esperas, y tras 35a
      solo su cola de PR-1 (7.6, 7.9, 8.1) antes que la fila. No libera la precedencia para ningún otro change.
      **Orden de fusión:** PR-1 se construye en paralelo pero se fusiona **después de 35a** (nace con `pnpm infra:up`
      y el almacén nuevo) y antes del PR-1 de 35b o después de su 11.6; PR-2 (staging) tras el primer despliegue de 35b.
      **Suite end-to-end reproducible sobre `apps/web-e2e`** (parte de la suite que hay, no la reescribe).
      **Un comando local = el de CI** (`web-e2e:e2e-stack`): infraestructura con `pnpm infra:up` bajo un proyecto de
      compose por checkout y bloque (`linkvault-e2e-<hash8>`) y un bloque de puertos propio, `nx serve` de `api` y
      `worker` y `web -c production` (no las imágenes del artefacto: prohíben el mock y su enrutado vive en Traefik),
      Playwright y apagado de lo arrancado también al fallar o interrumpir. Nunca prueba procesos ajenos: puerto
      ocupado (conexión en IPv4/IPv6 o `bind`) o `serve` de desarrollo del mismo checkout → no arranca nada; tras
      arrancar, quien atiende cada puerto es lo lanzado; tras apagar, el bloque queda libre. Entorno versionado
      (`apps/web-e2e/e2e.env`) + lista blanca del sistema, con `NX_LOAD_DOT_ENV_FILES=false`: el `.env` no llega, y
      las anulaciones del runner son flags, no variables de entorno.
      **Perfiles** `local` y `remote` (`E2E_BASE_URL`): en `remote` nada de Mongo, Redis, Mailpit ni salidas
      concretas de IA (los helpers `local-only` con su guardia `@remote-safe` llegan con el lote 2). El
      ensayo remoto contra la pila local solo con `--rehearse-remote`, con el `worker` reiniciado con un proveedor
      externo inalcanzable (desenlace `consent-required`). **Staging** (tras 35b): sin altas, cuentas `+e2e`
      persistentes creadas a mano, sin email verificado ni permiso de IA, guardias antes de limpiar, grupo sin
      visibilidad pública, links en dominios reservados, TLS sin excepciones, solo desde `main`, y nunca los días 7 y
      14 de la medición.
      **Determinismo:** esperas fijas y `setTimeout` prohibidos por lint en error, sincronización por eventos armados
      antes de la acción (lección de PR #59), intermitente = rojo (`failOnFlakyTests`), admisión con
      `--repeat-each=5` bajo carga en cada navegador y perfil, un salto sin motivo = rojo por lint, traza y vídeo
      de cada fallo.
      **CI:** `e2e.yml` nuevo, **solo `workflow_dispatch`** (sin `pull_request` hasta Q2), concurrencia en el job
      de staging, no obligatorio, artefactos a 7 días, staging sin destino o desde otra rama = rojo, minutos medidos
      en `infra/README.md` antes de decidir más disparadores (Q2). `ci.yml`, `cd-staging.yml`
      y `cd-prod.yml` no se tocan.
      **Lote 1 = el camino crítico** como un solo recorrido, en escritorio y en móvil emulado (`Pixel 7`): registro
      (o entrada con la cuenta de prueba en remoto) → grupo → segunda persona que abre sin sesión el enlace de
      invitación, crea su cuenta y se une (solo local)
      → guardar link → completar la oferta a mano → postulación → CV → encaje, con los pasos de cada perfil
      declarados y comprobados; entrada versionada junto a sus fixtures de replay y un Vitest de `libs/ai` que los
      exige. WebKit solo si la entrevista de 35b dice que alguien usa iPhone.
      Fuera: la suite contra las imágenes en local o en CI; el mapa de cobertura, el inventario y la limpieza de los
      specs no admitidos (lote 2); ejecutarla tras cada despliegue a staging (modificaría «CD a staging en main»;
      candidata para después de 35c, Q4); la extensión del navegador, los crons y los CLI.
  - name: usage-guide-fixes
    adrs: [055, 048, 051, 010, 050]
    agents: [backend-dev, frontend-dev]
    scope: |
      **Excepción a la precedencia de la fila 35** (ADR-048 §Consecuencias, extendida a la fila entera por ADR-051 §1),
      decidida por el owner el 2026-10-08 («Abramos el change») y registrada en **ADR-055 §1**. No es una pieza de la
      fila ni cambia su orden (35b → 35c); no libera la precedencia para ningún otro change. Si cubre también aplicar y
      fusionar antes de que termine la fila es la Q1 del change (bloqueante para `/opsx:apply`; recomendación: sí, antes
      de invitar en 35b). No toca ficheros de despliegue, workflows ni requirements de `platform/*`.
      Corrige los hallazgos de producto **H1, H2, H4, H5 y H6** de `docs/guia-de-uso/README.md` (alcance tras la
      iteración 1 del debate, 2026-10-08):
      **H1 (privacidad):** el nombre de quien escribió o pegó un campo del preview solo lo ve quien comparte un grupo
      con esa persona (regla de `users/profile`); a los demás la API devuelve `by: null` y el SPA dice «Escrito por otra
