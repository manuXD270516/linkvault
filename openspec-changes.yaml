  - name: deploy-image-verification
    adrs: [048, 049, 033, 032]
    agents: [devops, backend-dev, frontend-dev, ai-engineer]
    scope: |
      Fila 34. **Deuda descubierta en la revisión del 2026-09-23: `cd-staging` acumula 21 ejecuciones y 21
      fallos, desde la primera, que es el propio commit de `deploy-prod` (#35). El despliegue nunca ha
      funcionado y las filas 17–33 se fusionaron encima.**

      Dos causas, y la segunda explica por qué la primera sobrevivió 21 corridas:
      1. `docker/api.Dockerfile:23` y `worker.Dockerfile:22` hacen `pnpm install --prod --frozen-lockfile`
         dentro de `dist/apps/<app>`. **Reproducido localmente**: Nx genera ahí package.json, lockfile y
         workspace propios, así que no falta ningún lockfile. Lo que ocurre es que Nx **copia el campo
         `packageManager: pnpm@12.4.2`** al manifiesto generado y **no** escribe la entrada
         `packageManagerDependencies` que ese campo exige en pnpm 12; pnpm quiere añadirla, `--frozen-lockfile`
         se lo prohíbe y aborta con `ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE`. Retirando ese campo del
         manifiesto generado, el mismo install con el candado intacto termina en 3,4 s. Nunca pudo funcionar,
         y la reproducibilidad no es lo que estorba.
      2. El job de despliegue exige `STAGING_HOST`/`STAGING_SSH_USER`/`STAGING_SSH_KEY`/`STAGING_COMPOSE_DIR`
         y falla a propósito si faltan (ADR-033 D10: "a dry-run is NOT an accepted CD outcome"). El repo no
         tiene **ningún** secret configurado, así que el pipeline es **rojo por construcción**: el rojo era
         el estado esperado, nadie lo miraba, y un defecto real de build se escondió detrás.

      Entrega: build de imagen reproducible (sin renunciar a la resolución bloqueada); **verificación del
      artefacto en el propio CI, sin servidor** —las imágenes se levantan con compose en el runner y se
      comprueba que la api arranca y responde `/health` con mongo y redis—; y un estado de CD honesto, que
      distinga "no hay dónde desplegar" de "el despliegue falló", sin afirmar nunca que se desplegó algo que
      no se desplegó. El DoD exige `cd-staging` **en verde**, no "el CI pasa".

      El debate añadió un **segundo defecto nunca verificado**: `docker-compose.prod.yml` no declara variables que
      `api` y `worker` validan al arrancar (correo y TTL de auth en api; `WEB_BASE_URL` y correo en worker), y los dos
      terminan antes de escuchar. Arreglar la imagen no habría servido de nada. Por eso la verificación levanta **la
      pila entera con ese mismo compose**, no un compose escrito para CI: es donde el defecto estaba escondido.
      `cd-prod` **entra en el alcance** (hereda artefacto y los tres resultados; nunca se ha ejecutado).

      Fuera: provisionar servidor de staging y sus secretos —eso es la fila 35—, Traefik/DNS, publicar en registries
      de extensiones y cualquier cambio funcional de la aplicación.
  - name: staging-host
    adrs: [048, 033]
    agents: [devops]
    scope: |
      Fila 35. **Ningún change puede precederla mientras `cd-staging` termine en "verificado sin destino"**
      (ADR-048 §Consecuencias): esa precedencia es el compromiso, en vez de una fecha que nadie acordó.
      Provisionar el host de staging, sus secretos (`STAGING_HOST`, `STAGING_SSH_USER`, `STAGING_SSH_KEY`,
      `STAGING_COMPOSE_DIR`), DNS y Traefik/ACME, y llevar el pipeline del tercer resultado al segundo: desplegado
      de verdad, con el smoke post-deploy contra `api` en la red interna. Entran aquí las dos tareas que
      `deploy-image-verification` no pudo verificar porque el job de despliegue quedaba saltado (endurecer el paso
      de secretos al script remoto de ssh), y los primeros usuarios no-autor con su alta completa —lo que obliga a
      que el correo funcione de verdad, no solo a que la variable esté declarada—.
      Entra también el **rediseño del healthcheck de MinIO**: en `docker-compose.prod.yml` el healthcheck es
      `sh /ensure-buckets.sh`, o sea que **aprovisiona** buckets para contestar si el servicio está sano.
      Mezclar "¿está configurado?" con "¿está sano?" convierte cualquier fallo de configuración en un
      servicio enfermo para siempre, y es lo que hizo que el `grep` ausente (defecto 4.14 de
      `deploy-image-verification`) durase sin que nadie lo viera. Separar las dos preguntas —aprovisionar en
      un paso propio del despliegue, healthcheck de solo lectura— pide un despliegue de verdad contra el que
      probarlo, así que se hace aquí y no allí, donde solo se quitó el `grep`.
      Fuera: `cd-prod` a un host de producción, escalado, observabilidad nueva.
