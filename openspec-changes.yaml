  - name: e2e-suite-lot-2
    adrs: [053, 048]
    agents: [frontend-dev, devops]
    scope: |
      **Candidato posterior a la fila 35**, sin fila en `docs/design-v0.2.md` §6 hasta que el usuario la asigne: la
      excepción de ADR-053 cubre solo el lote 1 (Q3 de `e2e-suite`). Viene del reflect de la iteración 1 del debate
      de `e2e-suite` (B-V1-7).
      **Mapa de cobertura** `apps/web-e2e/catalog-coverage.json`: una entrada por número de `docs/catalogo-de-uso.md`
      (estado, lote, pruebas que lo cubren o motivo), y una **comprobación** que falla si falta un número, si el mapa
      cita una prueba inexistente o si una prueba admitida no está en el mapa, con el requirement «La cobertura se
      declara contra el catálogo» que `e2e-suite` retiró de su delta. **Ojo (C13 de `e2e-suite`):** si la
      comprobación es un target de Nx, sus `inputs` tienen que incluir `docs/catalogo-de-uso.md` —si no, la caché la
      daría por buena tras cambiar solo el catálogo—; si no, que viva en `repo-checks`, que no cachea.
      **Inventario** de la suite actual (pruebas por fichero) y **limpieza de los specs no admitidos**: orígenes
      escritos a mano (`home`, `groups`, `public-share`) y accesos a Mongo (`links`, `match`, `freshness`) por los
      helpers `local-only`, y `register-limit.ts` con el proyecto de compose por variable.
      **Helpers `local-only` y su guardia** (antigua tarea 3.3 de `e2e-suite`, R-18 de su iteración 2): Mongo,
      Redis/`docker` y Mailpit en `apps/web-e2e/src/support/local-only/`, con URIs del bloque por variable, que
      lanzan un error nombrando la operación si la prueba en curso lleva `@remote-safe`, en cualquier perfil; y el
      MODIFIED del requirement de perfiles de `platform/e2e-suite` que lo exige («una prueba apta para remoto que
      intente cualquiera de esas operaciones SHALL fallar nombrando la operación»), que `e2e-suite` retiró.
      **Lote 2 del plan de `e2e-suite` D14:** cuenta y salida (catálogo 2 y 4 con Mailpit, solo `local`; 5, 6 y 44).
      **Diferido desde `usage-guide-fixes` (iteración 1 de su debate, 2026-10-08):** H3 de la guía de uso —guardar una
      clave BYOK sin bóveda (`503 vault_unavailable`) muestra el genérico «Algo salió mal»—, junto con H11 (`AI_VAULT_KEY`
      vacía en `e2e.env`): con la bóveda obligatoria en producción solo se ve en pilas de prueba.
