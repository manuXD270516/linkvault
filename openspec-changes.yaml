  - name: staging-host
    adrs: [051, 048, 033, 034, 035, 032]
    agents: [devops, backend-dev, frontend-dev, ai-engineer]
    scope: |
      Fila 35b, segunda pieza de la fila 35 (ADR-051 §1). Tras archivar `object-store`. **Ningún change de otra
      fila puede preceder a la fila 35 mientras `cd-staging` termine en "verificado sin destino"** (ADR-048
      §Consecuencias), y esta es la pieza que lo lleva a "desplegado a staging".
      **Guardias antes de configurar ningún secreto (PR-1):** el modo de prueba nunca despliega y a staging solo
      despliega una corrida real de `main`, con el destino a medias evaluado antes que el modo y el límite escrito
      (el guardia evita accidentes, no autoriza: quien tiene escritura en el repo tiene root en staging;
      colaboradores, claves de despliegue y aplicaciones = solo el autor); OpenSSH nativo en vez de `appleboy/*`,
      con la clave pública del host (`STAGING_SSH_HOST_KEY`) en `known_hosts` y `StrictHostKeyChecking=yes`;
      configuración por `tar | ssh` a `.incoming-<sha12>` (`mkdir` sin `-p`) y usuario y token del registro por la
      entrada estándar de `deploy.sh` con `docker logout` (en la orden remota solo valores no secretos y validados;
      host validado por lista blanca); preflight a seis valores; `STAGING_COMPOSE_DIR` pasa a ruta fija del
      repositorio (`/srv/linkvault-staging`): lo que el script usa como ruta o como código va en el repositorio;
      `packages: write` solo en `build-verify-publish`; despliegue en el orden copia → login → plataformas y `pull`
      con el compose de `.incoming` → `install-config` (sin cambiar el inodo) → `up` con el compose instalado,
      conservando los últimos `.incoming-*`; relanzar solo el job de despliegue, hasta 30 días desde la corrida
      inicial; el primer despliegue relanza el preflight de la corrida del push de PR-1, sin republicar; Traefik
      sin `docker.sock`. `cd-prod` no se toca (35c).
      **Host:** Oracle Cloud Always Free Ampere A1 (`arm64`, 2 OCPU / 12 GB), región anotada, IP reservada,
      `iptables` de la imagen de OCI, "Out of host capacity". **Nombre:** `<ip>.sslip.io` + Let's Encrypt
      (primera emisión contra ACME *staging*; `dig` y Public Suffix List comprobados).
      **Correo:** SMTP con autenticación y TLS verificado en `api` y `worker`, rechazos con clase y sin secretos;
      Brevo con remitente verificado; envío real a tres proveedores con umbral; la interfaz dice que verificar no
      es necesario y que revisen spam; recuperación manual en el RUNBOOK.
      **IA:** llamada real por OpenRouter `:free` con `data_collection: deny` desde el host; cupo en el RUNBOOK;
      **sin búsqueda en staging**, como decisión del design y no del usuario (el compose de producción no la
      tiene; lo dicen el aviso y quien invita). Activarla (Meilisearch `arm64` y una cadena de embeddings en
      producción) sería un change posterior a 35c, que no retiene el archivado de este.
      **Antes de invitar:** reconstrucción reemplazando el volumen de arranque del propio host (sin fusionar a `main`
      durante el ensayo), copia de `.env.staging`, `/metrics` y `/health` no públicos, códigos de invitación fuera
      de los logs, entrevista que dice qué fuentes usan los invitados y recorrido en el móvil con cinco links de esas
      fuentes, aviso ampliado y recuento de cuentas no invitadas (Certificate Transparency hace pública la URL). Mongo
      no tiene autenticación: los scripts de medición pasan por una comprobación estática de solo lectura.
      **Usuarios y medición:** 3-5 personas que buscan empleo ahora, 2-3 en un mismo grupo; plan de medición
      escrito antes de invitar (umbrales, script `mongosh` de solo lectura, conversación del día 14, regla de
      decisión). Los días 7 y 14 son condiciones de cierre de la fila, no tareas.
      **Bloqueos del usuario, que impiden invitar,** decididos en paralelo a `object-store`: pasar la cuenta de
      Oracle a pago por uso (si sí, alerta de presupuesto a 1 €) y Q4 (quiénes), que también retienen PR-2 porque
      lleva sus anotaciones; y el umbral del correo (bandeja de entrada en 2 de 3 proveedores, o riesgo aceptado por
      escrito).
      **Dos PR, cada uno en una ventana de fusión autorizada por el usuario:** PR-1 (guardias y código de correo) y
      PR-2 (cierre), cuya ventana se pide junto con Q4; la vuelta atrás por GitHub se ejercita con PR-2 en `main`.
      **Trazabilidad de las letras (a)–(g)** del `scope` original de la fila 35, a las que apuntan
      `deploy-image-verification` (archivado), ADR-048 §8 y los comentarios de `docker-compose.yml` y
      `docker-compose.prod.yml`; no se renumeran: **(a)** workflow reutilizable de `verify` y `Check prompt
      assets` en los tres → `verify-reusable-workflow`; **(b)** rojo falso del modo de prueba con destino
      configurado → aquí (su parte de `cd-prod` → `verify-reusable-workflow`); **(c)** comprobación post-merge de que un `main` en rojo no mueve `:staging` →
      `verify-reusable-workflow`; **(d)** retirada el 2026-09-25 (la cerró `deploy-image-verification` con
      `profile-byok-consent-off-<vendor>`); **(e)** autenticación del adaptador SMTP → aquí; **(f)** almacén de
      objetos y espejo de su imagen → `object-store`, que sustituye MinIO en vez de mantener el espejo; **(g)**
      primera release, tarea 8.1 de `deploy-image-verification` → `verify-reusable-workflow`. Sin letra: endurecer
      el paso de secretos por ssh y llevar la configuración al host → aquí; rediseño del healthcheck del almacén →
      `object-store`.
      Fuera: `cd-prod` a un host de producción, escalado, observabilidad nueva, copias de seguridad de datos
      (staging es desechable), registro restringido, la extensión para estos usuarios, límites `413`/`429` en el
      borde y el aviso de registro abierto en la app (V2).
  - name: verify-reusable-workflow
    adrs: [051, 048, 050, 033]
    agents: [devops]
    scope: |
      Fila 35c, última pieza de la fila 35 (ADR-051 §1). Tras archivar `staging-host` **y** `i18n-catalog-gate`.
      **(a)** Workflow reutilizable de `verify` (`workflow_call`, alcance `affected`/`all` y referencia), invocado
      por `ci.yml`, `cd-staging.yml` y `cd-prod.yml`, con `Check prompt assets` dentro (hoy solo lo ejecuta
      `ci.yml`). Se escribe como **MODIFIED** de «El CD verifica con las mismas etapas que la integración
      continua», el requirement que añade `i18n-catalog-gate`, no como un ADDED paralelo.
      **(c)** Un `main` en rojo no mueve `:staging`: PR que rompe a propósito la verificación del artefacto,
      fusionado en una ventana autorizada por el usuario, y su reversión; digest de `:staging` y la imagen que
      corre el host, antes y después.
      **(g)** Primera release `v0.1.0`, que cierra la tarea 8.1 de `deploy-image-verification`: **solo `arm64`**
      mientras no haya host de producción, sin cambiar la spec de identidad por digest; la matriz
      multiarquitectura queda diferida. Escribir en el RUNBOOK que `latest` no es un tag de despliegue.
      **(h)** El reporte de `cd-staging`/`cd-prod` atribuye a la verificación un fallo de la **publicación**: en la
      corrida 36381575435 (falsación 9.3 de `object-store`) tituló «el artefacto NO pasó la verificación» y «no se
      publicó ni desplegó nada», con la verificación en verde y una imagen ya publicada en GHCR, porque toma el
      resultado del job entero como el de la verificación. Separar el resultado de verificar del de publicar (clase o
      desenlace propio para «verificado, publicación fallida») y probarlo con esa misma falsación. Trasladado aquí por
      decisión del usuario del 2026-09-28.
      **Precondiciones y orden:** archivar `i18n-catalog-gate` antes de `/opsx:apply` — **cumplida el 2026-09-25**
      (PR #63, `openspec/changes/archive/2026-09-25-i18n-catalog-gate`). 35a y 35c modifican los dos «CD a staging en main»; el orden por archivo es **35a → 35c**
      y el MODIFIED de aquí se redacta sobre el texto que deje 35a.
      **Guardias de `repo-checks` diferidos por `staging-host`:** ningún `${{ … }}` en los `run:` que abren
      sesión en un host, ningún secreto interpolado en `script:`, `source:` o `target:` de los pasos
      `appleboy/ssh-action` y `scp-action` de `cd-prod` (35b lo verifica en `cd-staging` con un script de un solo
      uso), y cada fichero que monta `docker-compose.prod.yml` está en la lista de configuración que el despliegue
      lleva al host (`infra/deploy/config-files.txt`).
      **Acciones fijadas (`actions-pinned`, antigua 3.7 de 35b):** en cada workflow, todo paso con `uses:` que reciba
      un secreto del destino (`secrets.STAGING_*`, `secrets.PROD_*`, `secrets.GHCR_READ_*`) **y todo `uses:` de
      un job con `packages: write`** se fija por el SHA de 40 caracteres de su commit, con el tag en comentario; la
      comprobación falla nombrando workflow, paso y acción, y se ve caer devolviendo uno a su tag. Escenario que 35b
      retiró: «Una acción que recibe secretos fijada por etiqueta rompe la comprobación» (GIVEN un workflow de CD con
      un paso que recibe secretos del destino y usa una acción de terceros fijada por etiqueta; WHEN corre la
      comprobación; THEN falla nombrando workflow, paso y acción).
      **No republicar un `sha-<12>` (antigua 3.8 de 35b):** guardia en `infra/ci/publish-artifact.sh`. Antes del
      `push`, `docker buildx imagetools inspect` del tag: si **no existe**, se publica; si falla por **error del
      registro**, clase `environment`; si **existe**, falla sin publicar con la clase propia `republish`, añadida a
      la lista blanca de clases del reporte y a su tabla como una dimensión más, con la descripción «relanza solo el
      job de despliegue». No se promete "con el mismo digest no hace nada": el build no es reproducible y ese caso no
      es observable. Se falsa **en CI**, relanzando entera una corrida de rama (que publicó su `sha-<12>`): la
      segunda falla con `republish` y el tag conserva el digest de la primera; no con `registry:2` en local. Una
      corrida manual sobre un commit ya publicado también falla así. El camino principal del primer despliegue de
      35b (su 6.3) relanza el preflight de la corrida del push y no republica; solo si cayó a su alternativa (un
      `workflow_dispatch` que republica) esa corrida no podrá repetirse. Escenario que 35b retiró: «Un tag de
      commit no se reescribe con otro digest» (GIVEN el tag de un commit ya publicado; WHEN una corrida posterior
      del mismo commit intenta publicar bajo ese tag; THEN falla sin publicar nombrando el tag, con clase
      `republish`, AND el tag sigue apuntando al digest original).
      **`cd-prod` (antiguas 2.6 y 3.5 de 35b):** `RUN_MODE` en su reporte y las cadenas en su `name:`, con el
      escenario «Modo de prueba con destino de producción configurado»; secretos como datos en sus pasos de ssh
      (`appleboy/*` fijadas, u OpenSSH nativo como staging); `packages: write` solo en su job de publicación; y
      `build-verify-publish` en `runs-on: ubuntu-24.04-arm`, necesario para una `v0.1.0` solo `arm64`.
      `GHCR_READ_*` no entra en su preflight: son secretos de repositorio compartidos con staging, y cada tag `v*`
      quedaría `partial` y en rojo.
      **`deploy-prod` hereda de `object-store` (traslado de su debate, iteración 1):** la comprobación de plataformas
      (`bash infra/deploy/check-image-platforms.sh`, salidas 0/3/4/2) después del login y antes del `pull`; tras el
      `up`, `docker compose … run --rm --no-deps api node object-store.js provision` y después la misma orden con
      `verify`, con el compose instalado; y, en `cd-prod`, el plazo de arranque leído de la línea
      `WAIT_TIMEOUT="${VERIFY_WAIT_TIMEOUT:-<n>}"` de `infra/ci/verify-artifact.sh` (validado con `^[0-9]{2,4}$`, como
      en 35b) en vez del `--wait-timeout` literal de hoy.
      Fuera: despliegue a un host de producción, matriz multiarquitectura.
