# CD staging: main → verify → GHCR → ssh/compose pull+up → smoke interno (ADR-033 D3/D10).
# Dry-run NO cuenta como éxito. Secrets obligatorios; si faltan, el job de deploy falla.
name: cd-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

env:
  NX_DAEMON: 'false'
  REGISTRY: ghcr.io

jobs:
  verify:
    name: verify (lint, specs, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Read MONGOMS_VERSION
        id: mongoms
        shell: bash
        run: |
          version="$(sed -nE "s/^export const MONGOMS_VERSION = '([^']+)';$/\1/p" tools/testing/src/testing.preset.ts)"
          if [ -z "$version" ]; then
            echo "::error file=tools/testing/src/testing.preset.ts::MONGOMS_VERSION not found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache MongoDB binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.mongoms.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - name: Lint
        run: pnpm nx affected -t lint

      - name: Validate OpenSpec specs
        run: pnpm exec openspec validate --all --no-interactive

      - name: Typecheck
        run: pnpm nx affected -t typecheck

      - name: Test
        env:
          AI_CHAIN: mock
          AI_MOCK_MODE: replay
        run: pnpm nx affected -t test

      - name: Eval (replay)
        env:
          NODE_ENV: test
          AI_CHAIN: mock
          AI_MOCK_MODE: replay
        run: pnpm nx affected -t eval-ci

      - name: Build
        run: pnpm nx affected -t build

  # Construir → verificar que arranca → publicar, en **un solo job** (ADR-048 §4). Las tres imágenes se construyen
  # con `load: true` y **sin `push`**: una imagen cargada vive solo en el daemon de este corredor, así que publicar
  # desde otro sitio la reconstruiría y subiría bits que nadie verificó.
  #
  # ESTADO: este job hace hoy construir → verificar. **La publicación la devuelve el grupo 6** del change
  # `deploy-image-verification` (6.1 `docker push` del tag ya cargado, 6.2 identidad por digest, 6.3 los dos tags).
  # Hasta entonces este workflow no publica nada, que es el lado seguro del orden: lo que la spec prohíbe
  # ("Nada se publica antes de verificarse") es lo contrario.
  build-verify:
    name: build and verify artifact
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image tag
        id: meta
        shell: bash
        run: |
          tag="sha-${GITHUB_SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` y `push: false`: la imagen queda **en el daemon de este corredor**, que es la única forma de
      # levantarla para verificarla. `cache-from`/`cache-to` se mantienen: abaratan **la** construcción, y no
      # autorizan una segunda (el grupo 6 publica este mismo artefacto, no uno reconstruido).
      # Solo el tag inmutable `sha-<12>`: el tag móvil `:staging` no puede existir antes de la verificación.
      - name: Build api (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/linkvault-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build worker (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/linkvault-worker:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build web (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/linkvault-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Verificación del artefacto (grupo 5 del change `deploy-image-verification`, ADR-048 §4): levanta
      # `docker-compose.prod.yml` —el **mismo** fichero que se despliega, nunca un compose escrito para CI— con las
      # imágenes que los tres pasos anteriores acaban de cargar, y exige que `api`, `worker` y `web` arranquen y
      # respondan. Traefik, los certificados y la publicación de puertos quedan fuera (exigen DNS y ACME); los
      # servicios no publican puertos y se entra con `docker compose exec`.
      #
      # Las cuatro variables de imagen y tag van **aquí**, como `env:` del paso, y no en `infra/ci/verify.env`: en el
      # fichero versionado serían un valor fijo que envejece y que reintroduciría el espacio de nombres por defecto
      # corregido en ADR-048 §4-bis. Sin ellas el compose resolvería `ghcr.io/manuxd270516/linkvault-*:latest` y se
      # verificaría una imagen que no es la de esta corrida; el script aborta nombrándolas.
      #
      # El plazo del `up --wait` es **360 s**, y el número está justificado contra los `start_period` y las ventanas
      # de reintento del compose: las dependencias tardan en el peor caso legítimo 140 s (minio: 20 s de
      # `start_period` + 12 reintentos × 10 s), y `api`/`worker` no empiezan a contar hasta entonces, con otros 180 s
      # cada uno (60 s + 12 × 10 s) → **320 s** de suelo, más un 12 % de margen para un corredor lento. Un plazo por
      # debajo de eso cortaría corridas sanas. El número vive en `infra/ci/verify-artifact.sh` (una sola fuente) y se
      # puede forzar con `VERIFY_WAIT_TIMEOUT`.
      #
      # Medido y corregido en la implementación: un `up --wait` **sin** plazo **no** se queda esperando para siempre
      # ante un bucle de reinicio, como suponía el change. Con los seis servicios declarando healthcheck, Compose
      # aborta en cuanto uno pasa a `unhealthy` (7 s con la imagen de `api` rota a propósito). Lo que convierte ese
      # "is unhealthy" en algo diagnosticable es el **volcado de `docker compose ps` y `logs`** que el script hace al
      # fallar, no el plazo.
      - name: Verify artifact (docker-compose.prod.yml stack in the runner)
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/linkvault-api
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/linkvault-worker
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/linkvault-web
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: infra/ci/verify-artifact.sh

      # `if: always()`: justo cuando la verificación falla es cuando hay volúmenes que limpiar. Sin `-v`, dos
      # corridas seguidas en el mismo corredor arrancarían sobre los datos de la anterior —una mongo ya inicializada
      # o un MinIO con los buckets ya creados esconderían los fallos de arranque que esto busca—.
      - name: Tear down verification stack
        if: always()
        run: infra/ci/teardown-artifact.sh

  deploy-staging:
    name: deploy staging (compose pull+up + internal smoke)
    needs: build-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require staging deploy secrets
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_COMPOSE_DIR: ${{ secrets.STAGING_COMPOSE_DIR }}
        run: |
          missing=()
          [ -z "$STAGING_HOST" ] && missing+=(STAGING_HOST)
          [ -z "$STAGING_SSH_USER" ] && missing+=(STAGING_SSH_USER)
          [ -z "$STAGING_SSH_KEY" ] && missing+=(STAGING_SSH_KEY)
          [ -z "$STAGING_COMPOSE_DIR" ] && missing+=(STAGING_COMPOSE_DIR)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for staging deploy: ${missing[*]}"
            echo "Documented in infra/README.md. A dry-run is NOT an accepted CD outcome (ADR-033 D10)."
            exit 1
          fi

      - name: SSH compose pull+up staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_COMPOSE_DIR }}"
            OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            export IMAGE_TAG="${{ needs.build-verify.outputs.image_tag }}"
            export API_IMAGE="ghcr.io/${OWNER}/linkvault-api"
            export WORKER_IMAGE="ghcr.io/${OWNER}/linkvault-worker"
            export WEB_IMAGE="ghcr.io/${OWNER}/linkvault-web"
            if [ -n "${{ secrets.GHCR_READ_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            docker compose -f docker-compose.prod.yml --env-file .env.staging pull
            docker compose -f docker-compose.prod.yml --env-file .env.staging up -d --wait

      - name: Smoke GET /health against api (Docker network, not Traefik)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_COMPOSE_DIR }}"
            body="$(docker compose -f docker-compose.prod.yml --env-file .env.staging exec -T api \
              node -e "fetch('http://127.0.0.1:3000/health').then(async r=>{const t=await r.text(); if(!r.ok){console.error(t);process.exit(1)}; console.log(t); const j=JSON.parse(t); if(j.status!=='up'||!j.checks||!j.checks.mongo||!j.checks.redis){process.exit(1)}}).catch(e=>{console.error(e);process.exit(1)})")"
            echo "$body"
            echo "$body" | grep -q '"status":"up"'
            echo "$body" | grep -q '"mongo"'
            echo "$body" | grep -q '"redis"'
            case "$body" in
              *'<html'*|*'<!DOCTYPE'*) echo "::error::Smoke returned HTML (SPA); must hit api internally"; exit 1 ;;
            esac
