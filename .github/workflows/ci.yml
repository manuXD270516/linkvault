# Integración continua de LinkVault (D14 de bootstrap-monorepo, spec platform/ci-pipeline).
# Etapas en orden, cada una en su propio step: si una falla, las siguientes no se ejecutan.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Una ejecución por ref; en PR, un push nuevo cancela la anterior. En main se completan todas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `actions: read`: nrwl/nx-set-shas consulta las ejecuciones previas en verde de main para fijar NX_BASE en push.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: lint, specs, typecheck, test, build
    # Fijado en lugar de ubuntu-latest para que un cambio de imagen no altere el binario de Mongo de los tests:
    # mongodb-memory-server resuelve MongoDB 7.0.x en Ubuntu 24.04 al build ubuntu2204 (no hay build 2404
    # antes de la 8.0).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Runner efímero: sin daemon de Nx (evita además el bloqueo de pipes heredados por el daemon).
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historial completo: nx affected necesita la base del cambio.
          fetch-depth: 0

      # Sin `version`: pnpm/action-setup lee el campo packageManager de package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # El store de pnpm lo cachea setup-node (`cache: pnpm`, clave derivada de pnpm-lock.yaml). Los binarios de
      # MongoDB de mongodb-memory-server se cachean aparte, con la versión leída de su única fuente.
      - name: Read MONGOMS_VERSION
        id: mongoms
        shell: bash
        run: |
          version="$(sed -nE "s/^export const MONGOMS_VERSION = '([^']+)';$/\1/p" tools/testing/src/testing.preset.ts)"
          if [ -z "$version" ]; then
            echo "::error file=tools/testing/src/testing.preset.ts::MONGOMS_VERSION not found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # mongodb-memory-server descarga en ~/.cache/mongodb-binaries (su ruta global por defecto).
      - name: Cache MongoDB binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.mongoms.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Comprobaciones de repositorio (tools/repo-checks): el compose de producción contra los esquemas de
      # configuración, y lo demás que se le vaya colgando. Va **antes** del cálculo de afectación y no por
      # `nx affected` a propósito: son lecturas de ficheros que tardan segundos, y así ninguna comprobación depende
      # de que el conjunto afectado la alcance (ADR-048 §5).
      # El guardia del final es el que impide que un agregador vacío cuente como verde: si el agregador no dice
      # cuántas comprobaciones ejecutó, o dice cero, el paso falla. Un verde sin nada mirado es la señal falsa que
      # este pipeline existe para no volver a dar.
      - name: Repo checks
        shell: bash
        run: |
          set -o pipefail
          pnpm nx run repo-checks:check 2>&1 | tee repo-checks.log
          ran="$(sed -nE 's/^repo-checks: ([0-9]+) comprobaciones ejecutadas.*$/\1/p' repo-checks.log | tail -n 1)"
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "::error file=tools/repo-checks/project.json::el agregador de repo-checks no ejecutó ninguna comprobación"
            exit 1
          fi
          echo "repo-checks: $ran comprobaciones ejecutadas"

      # Fija NX_BASE y NX_HEAD: en PR, la base de la rama destino; en main, el último commit con CI en verde.
      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - name: Lint
        run: pnpm nx affected -t lint

      - name: Validate OpenSpec specs
        run: pnpm exec openspec validate --all --no-interactive

      - name: Typecheck
        run: pnpm nx affected -t typecheck

      # IA en mock determinista (spec ci-pipeline, CLAUDE.md). En el step y no en el job: explícito y sin que otro
      # step lo pise. Gana a cualquier variable de IA del runner; el preset de Vitest de tools/test-env lo fija también
      # en local, y tools/test-env/src/test-env.preset.spec.ts comprueba lo que ve el proceso de test.
      - name: Test
        env:
          AI_CHAIN: mock
          AI_MOCK_MODE: replay
          AI_EMBED_CHAIN: mock
        run: pnpm nx affected -t test

      # Eval harness en replay contra la línea base (D10 de ai-eval-harness, ADR-019): falla si una métrica bloqueante,
      # el golden o la versión del prompt difieren de baseline.json; el mensaje nombra la métrica y ambos valores y se
      # reproduce en local con `pnpm nx run ai:eval-ci`. Mismo entorno de IA que Test, más NODE_ENV=test.
      - name: Eval (replay)
        env:
          NODE_ENV: test
          AI_CHAIN: mock
          AI_MOCK_MODE: replay
          AI_EMBED_CHAIN: mock
        run: pnpm nx affected -t eval-ci

      - name: Build
        run: pnpm nx affected -t build

      # Los prompts de libs/ai se copian como assets del worker (D7 de ai-gateway-core) y de api (D1 de
      # paste-job-description), y copy-webpack-plugin no falla si no copia nada. El runner parte de un checkout limpio
      # sin dist/, así que dist/apps/<app>/main.js solo existe si el step Build construyó la app (o la restauró de la
      # caché de Nx, que restaura también sus assets): sin él, la app no estaba afectada y no hay nada que comprobar.
      - name: Check prompt assets
        shell: bash
        run: |
          for app in worker api; do
            if [ ! -f "dist/apps/$app/main.js" ]; then
              echo "$app not built in this run; skipping its prompt assets check"
              continue
            fi
            prompt="dist/apps/$app/assets/ai/prompts/classify-skills.v1.md"
            if [ ! -f "$prompt" ]; then
              echo "::error file=apps/$app/webpack.config.js::$prompt missing: the $app build did not copy libs/ai/src/infrastructure/prompts as assets"
              exit 1
            fi
            echo "$app prompt assets present: $prompt"
          done
