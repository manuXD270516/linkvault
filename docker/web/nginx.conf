# Servidor de la imagen `web`: el SPA y sus cabeceras de seguridad (ADR-057, edge-security-headers).
#
# TRAMPA DE HERENCIA DE `add_header`: nginx NO hereda los `add_header` del nivel `server` en un `location` que declare
# los suyos; basta uno para que se pierdan todos los demás. Por eso **ningún `location` declara `add_header`**: las
# cabeceras de seguridad viven una sola vez, aquí, en el bloque `server`, con `always` (para que también salgan en los
# 404 y demás errores). Un guardia estático (`check-edge-security-headers`) lo comprueba.
#
# `Cache-Control` es la única cabecera SIN `always`, a propósito: sin `always`, nginx solo la añade a las respuestas
# 200/204/206/301/302/303/304/307/308, y así un 404 de `/algo.js` no recibe `immutable`. Sus valores salen del `map`
# de abajo (los mismos de siempre), y no se usa `expires` porque duplicaría el `Cache-Control`.
#
# Rollback de la CSP (camino (i) de D9, RUNBOOK): cambiar el nombre de la cabecera a
# `Content-Security-Policy-Report-Only` y añadir una línea `# csp-report-only: AAAA-MM-DD <motivo>`. El guardia solo la
# admite así, y `X-Frame-Options: DENY` sigue cubriendo el encuadre.

map $uri $lv_cache_control {
    default                                                  "";
    /index.html                                              "no-cache";
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$            "public, max-age=604800, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Defense in depth for invite codes in /unirse (Traefik also sets Referrer-Policy on SPA routes).
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $lv_cache_control;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Un estático que no existe responde 404 (y no el fallback del SPA), como antes de este change.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
    }
}
